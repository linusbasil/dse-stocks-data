name: Daily DSE Prices

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install requests beautifulsoup4 yfinance

      - name: Run python dse_fetcher.py
        env:
          MANSA_API_KEY: ${{ secrets.MANSA_API_KEY }}
        run: python dse_fetcher.py

      - name: Build Bingwa payload
        run: |
          python3 - <<'EOF'
          import json

          with open('dse_prices.json') as f:
              raw = json.load(f)

          prices = {}
          for name, value in raw.items():
              symbol = name.replace(' PLC', '').strip()
              try:
                  price = float(value)
              except (TypeError, ValueError):
                  continue
              prices[symbol] = price

          with open('dse_payload.json', 'w') as f:
              json.dump({"prices": prices}, f)
          EOF

      - name: Refresh DSE stocks on Bingwa
        run: |
          curl -fsSL -X POST \
            -A "Mozilla/5.0 (compatible; BingwaBot/1.0)" \
            "https://bingwastocks.com/api/public/refresh-dse-stocks" \
            -H "x-api-key: ${{ secrets.ADMIN_ACCESS_KEY }}" \
            -H "Content-Type: application/json" \
            --data @dse_payload.json

      - name: Commit and push prices
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dse_prices.json
          git diff --cached --quiet || git commit -m "Update DSE prices"
          git push