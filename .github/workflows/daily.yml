name: Daily DSE Prices

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python dse_fetcher.py
      
